name: LoopTroop source
description: >-
  Checks out the LoopTroop commit the documentation is verified against, with
  exactly the files verify:site reads from it.

runs:
  using: composite
  steps:
    # The commit is read from the script that regenerates docs/cli.md, not
    # written here, so the pages and the checkout cannot name different
    # commits, and moving it never edits a workflow. follow-looptroop.yml
    # publishes with GITHUB_TOKEN, which may not push a change to one.
    - name: Read CLI_SOURCE_REF
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        ref=$(sed -n "s/^export const CLI_SOURCE_REF = '\([0-9a-f]\{40\}\)'$/\1/p" scripts/sync-cli-reference.mjs)
        if [ -z "${ref}" ]; then
          echo "::error::scripts/sync-cli-reference.mjs does not pin CLI_SOURCE_REF to a full commit."
          exit 1
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Check out that LoopTroop commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: looptroop-ai/LoopTroop
        ref: ${{ steps.pin.outputs.ref }}
        path: .source/LoopTroop
        persist-credentials: false
        # Everything `scripts/docs-install-catalog.mjs` imports, directly or
        # not. A file missing here fails verify:site with ERR_MODULE_NOT_FOUND
        # as soon as CLI_SOURCE_REF reaches a commit that imports it.
        sparse-checkout: |
          package.json
          scripts/docs-install-catalog.mjs
          scripts/package-manifests.ts
          scripts/smoke-published.mjs
          scripts/smoke-lib.mjs
          scripts/tool-path.ts
          server/lib/executablePath.ts
          shared/installChannel.ts
          shared/nodeFloor.ts
        sparse-checkout-cone-mode: false
