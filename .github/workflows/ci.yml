name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  LOOPTROOP_SOURCE_ROOT: ${{ github.workspace }}/.source/LoopTroop

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout the latest merged LoopTroop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: looptroop-ai/LoopTroop
          ref: 10888081de5a4ac46af30810ede613b56d83fda4
          path: .source/LoopTroop
          persist-credentials: false
          sparse-checkout: |
            package.json
            scripts/docs-install-catalog.mjs
            scripts/smoke-published.mjs
            scripts/smoke-lib.mjs
            scripts/tool-path.ts
            server/lib/executablePath.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:site
      - run: npm run licenses:check
      - name: Verify build did not modify tracked files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
