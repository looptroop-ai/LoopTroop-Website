name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  LOOPTROOP_SOURCE_ROOT: ${{ github.workspace }}/.source/LoopTroop

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout the latest merged LoopTroop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: looptroop-ai/LoopTroop
          ref: 300ed63dc21d1c7aa446abbc209dc84d50a72506
          path: .source/LoopTroop
          persist-credentials: false
          # Everything `scripts/docs-install-catalog.mjs` imports, directly or
          # not. A file missing here fails verify:site with ERR_MODULE_NOT_FOUND
          # as soon as CLI_SOURCE_REF reaches a commit that imports it.
          sparse-checkout: |
            package.json
            scripts/docs-install-catalog.mjs
            scripts/package-manifests.ts
            scripts/smoke-published.mjs
            scripts/smoke-lib.mjs
            scripts/tool-path.ts
            server/lib/executablePath.ts
            shared/installChannel.ts
            shared/nodeFloor.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:site
      - run: npm run licenses:check
      - name: Verify build did not modify tracked files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
